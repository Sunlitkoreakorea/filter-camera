<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="필터 카메라">
<meta name="description" content="볼록, 소용돌이, 만화경, 열화상 같은 효과 16가지와 색 필터 27가지(인스타 느낌 14가지 포함)를 실시간으로 입혀 찍는 웹 카메라.">
<title>필터 카메라</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body data-mode="camera">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-filters" viewBox="0 0 24 24"><circle cx="9" cy="9.5" r="5.5"/><circle cx="15" cy="9.5" r="5.5"/><circle cx="12" cy="14.5" r="5.5"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4.5 11a7.5 7.5 0 0 1 13-4.2L19.5 9M19.5 4.5V9H15M19.5 13a7.5 7.5 0 0 1-13 4.2L4.5 15M4.5 19.5V15H9"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-warp" viewBox="0 0 24 24"><path d="M4.5 4.5Q12 1.5 19.5 4.5Q22.5 12 19.5 19.5Q12 22.5 4.5 19.5Q1.5 12 4.5 4.5Z"/><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div id="app">
  <header class="bar top cam-only">
    <button class="ic warpbtn" aria-label="왜곡 효과"><svg><use href="#i-warp"/></svg></button>
    <button id="bStrip" class="ic on" aria-label="필터 줄"><svg><use href="#i-filters"/></svg></button>
    <button id="bRatio" class="ic txt" aria-label="비율">4:3</button>
    <button id="bTimer" class="ic" aria-label="타이머"><svg><use href="#i-timer"/></svg><b class="badge"></b></button>
    <button id="bGrid" class="ic" aria-label="격자"><svg><use href="#i-grid"/></svg></button>
  </header>
  <header class="bar top edit-only">
    <button id="bBack" class="ic" aria-label="사진첩으로"><svg><use href="#i-back"/></svg></button>
    <span class="sp"></span>
    <button class="ic warpbtn" aria-label="왜곡 효과"><svg><use href="#i-warp"/></svg></button>
    <button id="bDelete" class="ic" aria-label="지우기"><svg><use href="#i-trash"/></svg></button>
    <button id="bSave" class="ic" aria-label="저장"><svg><use href="#i-save"/></svg></button>
  </header>

  <main id="stage">
    <div id="frame">
      <canvas id="view"></canvas>
      <div id="grid" hidden></div>
      <div id="flash"></div>
      <div id="warps" hidden></div>
      <div id="fname"></div>
    </div>
    <div id="count"></div>
    <div id="msg" hidden><p></p><button id="bRetry">다시 시도</button></div>
    <div id="amount" hidden>
      <input id="amt" type="range" min="0" max="100" step="1" value="100" aria-label="필터 세기">
      <output id="amtv">100</output>
    </div>
  </main>

  <nav id="strip" aria-label="필터"></nav>

  <footer class="bar bottom cam-only">
    <button id="bAlbum" aria-label="사진첩"><img alt=""></button>
    <button id="bShutter" aria-label="찍기"><span></span></button>
    <button id="bFlip" class="ic" aria-label="카메라 전환"><svg><use href="#i-flip"/></svg></button>
  </footer>
</div>

<section id="album" hidden>
  <header class="bar top">
    <button id="bAlbumBack" class="ic" aria-label="카메라로"><svg><use href="#i-close"/></svg></button>
    <span class="sp"></span>
  </header>
  <div id="tiles"></div>
  <input id="file" type="file" accept="image/*" multiple hidden>
</section>

<video id="video" playsinline muted autoplay></video>
<script type="module" src="app.js?v=12"></script>
</body>
</html>
